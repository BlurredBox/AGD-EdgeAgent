[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blurredbox-edge-agent"
version = "0.1.3"
description = "BlurredBox edge agent: computes per-window summary statistics locally and sends only those"
license = {text = "Proprietary"}
requires-python = ">=3.12"
dependencies = [
    "blurredbox-agd>=1.2.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "httpx>=0.28.0",
    "structlog>=23.1.0",
    "orjson>=3.9.0",
    "pyyaml>=6.0",
]

# Optional inputs. The base wheel stays minimal: nothing below is imported unless the
# matching `source` type is configured (pins: requirements-edge-postgres.txt / -parquet.txt / -kafka.txt).
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.6"]
parquet = ["pyarrow>=15.0.0"]
kafka = ["confluent-kafka>=2.12.2", "fastavro>=1.12.1"]

[project.scripts]
blurredbox-edge-agent = "edge_agent.__main__:main"
blurredbox-edge-replay = "edge_agent.history_replay:main"

[tool.setuptools]
packages = ["edge_agent", "corpus"]
